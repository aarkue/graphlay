# One tag releases the crates, the npm package, the Python wheels, the CLI binaries and a GitHub
# release. RELEASING.md lists the one-time registry setup.
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches every manifest version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          npm_version=$(node -p "require('./bindings/wasm/js/package.json').version")
          echo "tag $tag, Cargo.toml $cargo_version, package.json $npm_version"
          test "$tag" = "$cargo_version" && test "$tag" = "$npm_version"
          grep -q "^## $tag" CHANGELOG.md
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --all-features
      - run: cargo test -p graphlay-cli -p graphlay-wasm

  crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # graphlay-wasm and graphlay-py are publish = false, so this publishes graphlay and then
      # graphlay-cli, in dependency order.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g wasm-pack
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter graphlay build
      - run: pnpm --filter graphlay test
      - run: npm publish --provenance --access public
        working-directory: bindings/wasm/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  wheels:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: graphlay-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: graphlay-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: graphlay-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p graphlay-cli --target ${{ matrix.target }}
      - name: Name the binary after its platform
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/graphlay.exe" "out/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/graphlay" "out/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  github-release:
    needs: [verify, crates, npm, pypi, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: binaries
      - name: Extract the changelog section
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## " v { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: binaries/*
