[package]
name = "graphlay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The graphlay layout engine on the command line: JSON in, JSON or SVG out"
readme = "README.md"
keywords = ["graph", "layout", "sugiyama", "svg", "cli"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "graphlay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
graphlay = { path = "..", version = "0.2.0", features = ["schemars"] }
serde_json = "1"
