[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "graphlay"
dynamic = ["version"]
description = "Deterministic layered graph layout, tidy trees and SVG rendering, in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
keywords = ["graph", "layout", "sugiyama", "layered", "svg", "networkx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://aarkue.github.io/graphlay/"
Repository = "https://github.com/aarkue/graphlay"

[project.optional-dependencies]
networkx = ["networkx>=3.0"]

[tool.maturin]
python-source = "python"
module-name = "graphlay._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
